<app-default-login-layout
  title="Entre na sua conta"
  [primaryBtnText]="isSubmitting() ? 'Entrando...' : 'Entrar'"
  secondaryBtnText="Criar conta"
  (submit)="submit()"
  (navigate)="navigateToRegister()"
  [disablePrimaryBtn]="loginForm.invalid || isSubmitting()"
  [loading]="isSubmitting()"
>
  <form [formGroup]="loginForm" (ngSubmit)="submit()">
    <app-primary-input
      formControlName="email"
      inputName="email"
      type="email"
      autocomplete="email"
      label="E-mail"
      placeholder="nome@exemplo.com"
      [invalid]="loginForm.controls.email.touched && loginForm.controls.email.invalid"
      [errorMessage]="emailErrorMessage()"
    >
      <img src="/assets/svg/email-icon.svg" alt="" />
    </app-primary-input>
    <app-primary-input
      formControlName="password"
      inputName="password"
      type="password"
      autocomplete="current-password"
      label="Senha"
      [invalid]="loginForm.controls.password.touched && loginForm.controls.password.invalid"
      [errorMessage]="passwordErrorMessage()"
    >
      <img src="/assets/svg/password-icon.svg" alt="" />
    </app-primary-input>
  </form>
</app-default-login-layout>
