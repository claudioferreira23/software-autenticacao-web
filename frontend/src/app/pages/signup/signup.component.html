<app-default-login-layout
  title="Crie sua conta"
  [primaryBtnText]="isSubmitting() ? 'Criando conta...' : 'Cadastrar'"
  secondaryBtnText="Já possui uma conta?"
  (submit)="submit()"
  (navigate)="navigateToLogin()"
  [disablePrimaryBtn]="signupForm.invalid || isSubmitting()"
  [loading]="isSubmitting()"
>
  <form [formGroup]="signupForm" (ngSubmit)="submit()">
    <app-primary-input
      formControlName="name"
      inputName="name"
      type="text"
      autocomplete="name"
      label="Nome completo"
      placeholder="João da Silva"
      [invalid]="signupForm.controls.name.touched && signupForm.controls.name.invalid"
      [errorMessage]="nameErrorMessage()"
    >
      <img src="/assets/svg/email-icon.svg" alt="" />
    </app-primary-input>
    <app-primary-input
      formControlName="email"
      inputName="email"
      type="email"
      autocomplete="email"
      label="E-mail"
      placeholder="nome@exemplo.com"
      [invalid]="signupForm.controls.email.touched && signupForm.controls.email.invalid"
      [errorMessage]="emailErrorMessage()"
    >
      <img src="/assets/svg/email-icon.svg" alt="" />
    </app-primary-input>
    <app-primary-input
      formControlName="password"
      inputName="password"
      type="password"
      autocomplete="new-password"
      label="Senha"
      [invalid]="signupForm.controls.password.touched && signupForm.controls.password.invalid"
      [errorMessage]="passwordErrorMessage()"
    >
      <img src="/assets/svg/password-icon.svg" alt="" />
    </app-primary-input>
    <app-primary-input
      formControlName="passwordConfirm"
      inputName="passwordConfirm"
      type="password"
      autocomplete="new-password"
      label="Confirme sua senha"
      [invalid]="passwordConfirmationInvalid()"
      [errorMessage]="passwordConfirmationErrorMessage()"
    >
      <img src="/assets/svg/password-icon.svg" alt="" />
    </app-primary-input>
  </form>
</app-default-login-layout>
